<!-- DNFL Rules -->

<div id="dnfl_rules" class="mobile-wrap">
   <table class="homepagemodule report" cellspacing="1" align="center">
    <caption>DNFL Official Rulebook</caption>
  </table>

  <div class="toggle_tabs"> 
    <br/>
    
    <div class="dnfl-module-container">
        
        <!-- Controls Bar -->
        <div class="dnfl-controls" style="justify-content: space-between; align-items: center;">
            <div class="dnfl-filter-group" style="flex-direction: row; align-items: center; gap: 10px;">
                <label for="dnfl_rulesYearSelector">Season:</label>
                <select id="dnfl_rulesYearSelector" class="dnfl-select" onchange="window.changeRulesYear()"></select>
            </div>

            <div class="dnfl-rules-actions" style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="dnfl-visibility-toggle-btn" onclick="window.showSubMenus()">Show Sub Menus</button>
                <button class="dnfl-visibility-toggle-btn" onclick="window.expandAllRules()">Expand All</button>
                <button class="dnfl-visibility-toggle-btn" onclick="window.collapseAllRules()">Collapse All</button>
            </div>
        </div>

        <!-- Rulebook Output Wrapper -->
        <div id="dnfl_rulesOutputContainer" class="dnfl-rules-wrapper">
            <div style="text-align: center; padding: 2.5rem; color: #555; font-weight: 600;">
                <i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i> Loading DNFL Official Rulebook...
            </div>
        </div>

    </div>

    <!-- Markdown Parser Dependency (Marked.js) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Initialization Waiter -->
    <script>
        (function checkInit() {
            if (typeof window.initRulesDashboard === 'function') {
                window.initRulesDashboard('%YEAR%');
            } else {
                setTimeout(checkInit, 50);
            }
        })();
    </script>

  </div>
</div>
