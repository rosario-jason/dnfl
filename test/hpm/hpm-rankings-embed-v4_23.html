<!-- DNFL POWER RANKINGS MODULE EMBED v4.23 -->
<div class="dnfl-card" id="dnfl-rankings-container">
    <div class="dnfl-card-header">
        <h3 class="dnfl-card-title" id="dnfl-rankings-title"><i class="fa-solid fa-ranking-star"></i> DNFL LEAGUE POWER RANKINGS</h3>
    </div>
    
    <div class="dnfl-card-body">
        <!-- Toolbar / Filters -->
        <div class="dnfl-toolbar">
            <div class="dnfl-filter-group">
                <label for="dnfl-rankings-select-week">Week</label>
                <select id="dnfl-rankings-select-week" class="dnfl-select">
                    <option value="latest">Loading Weeks...</option>
                </select>
            </div>
            <div class="dnfl-filter-group">
                <label for="dnfl-rankings-select-conf">Conference</label>
                <select id="dnfl-rankings-select-conf" class="dnfl-select">
                    <option value="All">All Conferences</option>
                </select>
            </div>
            
            <!-- Right-Aligned Action Buttons -->
            <div class="dnfl-buttons-right">
                <button class="dnfl-btn dnfl-btn-secondary" id="dnfl-rankings-toggle-chart-btn" title="Toggle Chart View">
                    <i class="fa-solid fa-chart-bar"></i> Hide Chart
                </button>
            </div>
        </div>
        
        <!-- Legend Panel Container -->
        <div id="dnfl-rankings-legend" class="dnfl-legend-panel">
            <div class="dnfl-legend-note">Loading conference keys...</div>
        </div>
        
        <!-- Chart Canvas Wrapper -->
        <div id="dnfl-rankings-chart-wrapper" class="dnfl-chart-wrapper">
            <canvas id="dnfl-rankings-chart"></canvas>
        </div>
        
        <!-- Main Data Table Wrapper -->
        <div id="dnfl-rankings-table-wrapper" class="dnfl-table-wrapper">
            <table class="dnfl-table" id="dnfl-rankings-table">
                <tbody id="dnfl-rankings-tbody">
                    <tr>
                        <td colspan="6" class="dnfl-status-loading">
                            <i class="fa-solid fa-spinner fa-spin"></i> Loading Power Rankings Data...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
