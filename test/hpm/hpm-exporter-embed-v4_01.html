<!-- DNFL Exporter Module Shell v4.01 -->
<div class="dnfl-card" id="dnfl-exporter-container">
    <div class="dnfl-card-header">
        <h3 class="dnfl-card-title">
            <i class="fa-solid fa-file-export"></i> DNFL Data Exporter & Power Rankings Generator
        </h3>
    </div>
    
    <div class="dnfl-card-body">
        <div class="dnfl-toolbar">
            <div class="dnfl-filter-group">
                <label for="dnfl-export-report-select">Report Type</label>
                <select id="dnfl-export-report-select" class="dnfl-select">
                    <option value="powerRankings">⚡ Automated Power Rankings (Calculated)</option>
                    <option value="rosters">Franchise Rosters & YTD Points</option>
                    <option value="matchups">Head-to-Head Matchup Scores</option>
                    <option value="weeklyDetails">Weekly Player Lineups & Scores</option>
                    <option value="standings">League Standings & Playoff Seeds</option>
                </select>
            </div>

            <div class="dnfl-filter-group" id="dnfl-export-week-group">
                <label for="dnfl-export-week-select">Target Week</label>
                <select id="dnfl-export-week-select" class="dnfl-select"></select>
            </div>

            <div class="dnfl-filter-group">
                <label for="dnfl-export-format-select">Export Format</label>
                <select id="dnfl-export-format-select" class="dnfl-select">
                    <option value="csv">CSV (Spreadsheet / Power Rankings Feed)</option>
                    <option value="json">JSON (Programmatic Data)</option>
                    <option value="markdown">Markdown (AI Prompt / Document Ready)</option>
                </select>
            </div>

            <div class="dnfl-buttons-right">
                <button id="dnfl-export-generate-btn" class="dnfl-btn">
                    <i class="fa-solid fa-bolt"></i>
                    <span class="btn-text">Generate Report</span>
                </button>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="dnfl-export-status" class="dnfl-status-loading" style="padding: 12px 0;">
            Select report options above and click Generate.
        </div>

        <!-- Action Toolbar -->
        <div id="dnfl-export-actions" class="dnfl-toolbar" style="display: none; border-top: 1px solid var(--dnfl-border-medium); padding-top: 12px; margin-top: 12px;">
            <button id="dnfl-export-copy-btn" class="dnfl-btn">
                <i class="fa-solid fa-copy"></i>
                <span class="btn-text">Copy to Clipboard</span>
            </button>
            <button id="dnfl-export-download-btn" class="dnfl-btn">
                <i class="fa-solid fa-download"></i>
                <span class="btn-text">Download File</span>
            </button>
        </div>

        <!-- Data Preview Region -->
        <div class="dnfl-table-wrapper" id="dnfl-export-preview-container" style="margin-top: 16px;"></div>
    </div>
</div>
