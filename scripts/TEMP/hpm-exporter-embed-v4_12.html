<!-- DNFL Exporter Module Shell v4.12 -->
<div id="dnfl-exporter-container" class="dnfl-exporter-wrapper">
    <div class="dnfl-exporter-header">
        <h2 class="dnfl-exporter-title">DNFL Data Exporter Module</h2>
        <p class="dnfl-exporter-subtitle">Extract, preview, and download official Duke Networking Fantasy League data in CSV, JSON, or Markdown formats.</p>
    </div>

    <div class="dnfl-exporter-toolbar">
        <div class="dnfl-filter-group">
            <label for="dnfl-export-report-select" class="dnfl-label">Select Report</label>
            <select id="dnfl-export-report-select" class="dnfl-select">
                <option value="standings">1. League Standings</option>
                <option value="rosters">2. Franchise Rosters</option>
                <option value="matchups">3. Weekly Matchups</option>
                <option value="weeklyDetails">4. Weekly Lineups</option>
                <option value="transactions">5. League Transactions</option>
                <option value="publishedPowerRankings">6. Power Rankings</option>
                <option value="powerRankings">7. Power Rankings Calc</option>
            </select>
        </div>

        <div class="dnfl-filter-group" id="dnfl-export-week-group">
            <label for="dnfl-export-week-select" class="dnfl-label">Select Week</label>
            <select id="dnfl-export-week-select" class="dnfl-select">
                <!-- Dynamically populated by dnfl-exporter JS -->
            </select>
        </div>

        <div class="dnfl-filter-group">
            <label for="dnfl-export-format-select" class="dnfl-label">Export Format</label>
            <select id="dnfl-export-format-select" class="dnfl-select">
                <option value="csv">CSV (Spreadsheet)</option>
                <option value="json">JSON (API / Data)</option>
                <option value="markdown">Markdown (AI / Docs)</option>
            </select>
        </div>

        <div class="dnfl-action-group">
            <button id="dnfl-export-btn-preview" class="dnfl-btn dnfl-btn-primary">Generate Report</button>
            <button id="dnfl-export-btn-copy" class="dnfl-btn dnfl-btn-secondary">Copy to Clipboard</button>
            <button id="dnfl-export-btn-download" class="dnfl-btn dnfl-btn-success">Download File</button>
        </div>
    </div>

    <div class="dnfl-exporter-preview-container">
        <div id="dnfl-exporter-status" class="dnfl-status-message">Ready to generate report. Select options above.</div>
        <div id="dnfl-exporter-preview-table-wrap" class="dnfl-preview-table-wrap"></div>
        <pre id="dnfl-exporter-preview-text" class="dnfl-preview-text dnfl-is-hidden"></pre>
    </div>
</div>
