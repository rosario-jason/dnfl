<!-- Duke Networking Fantasy League (DNFL) - Waiver Target & Player Matrix Embed v4.07 -->
<div class="dnfl-card" id="dnfl-waivers-container">
    
    <!-- LEVEL 1: CARD HEADER -->
    <div class="dnfl-card-header">
        <h3 class="dnfl-card-title">
            <i class="fa-solid fa-bolt"></i> DNFL Waiver Targets
        </h3>
        <span class="dnfl-card-subtitle">
            Player Market Value Evaluation
        </span>
    </div>

    <!-- LEVEL 2: CARD BODY -->
    <div class="dnfl-card-body">

        <!-- BENCHMARK FLOOR PANEL -->
        <div class="dnfl-legend-panel dnfl-banner-panel">
            <div class="dnfl-legend-title">
                <i class="fa-solid fa-shield-halved"></i> Your Roster Floor Benchmarks:
            </div>
            <div id="dnfl-waivers-banner-pills" class="dnfl-banner-pills-wrapper">
                <div class="dnfl-floor-pill-skeleton">Loading floor benchmarks...</div>
            </div>
        </div>

        <!-- CONTROL TOOLBAR (ALL INLINE) -->
        <div class="dnfl-toolbar">
            
            <!-- VIEW SELECTOR DROPDOWN -->
            <div class="dnfl-filter-group">
                <label for="dnfl-waivers-view-filter" class="dnfl-label">View:</label>
                <div class="dnfl-select-wrapper">
                    <select id="dnfl-waivers-view-filter" class="dnfl-select">
                        <option value="waiverTargets">Waiver Targets</option>
                        <option value="allPlayers">All Players</option>
                        <option value="freeAgents">Free Agents</option>
                        <option value="rostered">Rostered Players</option>
                    </select>
                </div>
            </div>

            <!-- POSITION SELECTOR DROPDOWN -->
            <div class="dnfl-filter-group">
                <label for="dnfl-waivers-pos-filter" class="dnfl-label">Pos:</label>
                <div class="dnfl-select-wrapper">
                    <select id="dnfl-waivers-pos-filter" class="dnfl-select">
                        <option value="ALL">All Positions</option>
                        <option value="QB">QB</option>
                        <option value="RB">RB</option>
                        <option value="WR">WR</option>
                        <option value="TE">TE</option>
                        <option value="FLEX">FLEX (RB/WR/TE)</option>
                        <option value="PK">PK</option>
                        <option value="DEF">DEF</option>
                    </select>
                </div>
            </div>

            <!-- INLINE SEARCH INPUT FIELD -->
            <div class="dnfl-filter-group dnfl-filter-group--search">
                <div class="dnfl-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass dnfl-search-icon"></i>
                    <input type="text" id="dnfl-waivers-search-input" class="dnfl-input-search" placeholder="Search player or team..." />
                </div>
            </div>

        </div>

        <!-- SUMMARY COUNT & DATA TABLE WRAPPER -->
        <div class="dnfl-table-summary">
            <span id="dnfl-waivers-count-summary" class="dnfl-text-muted">Loading players...</span>
        </div>
        
        <div class="dnfl-table-wrapper">
            <table class="dnfl-table dnfl-waivers-table">
                <thead id="dnfl-waivers-thead">
                    <!-- Dynamic Headers Rendered via JS -->
                </thead>
                <tbody id="dnfl-waivers-tbody">
                    <!-- Dynamic Rows Rendered via JS -->
                </tbody>
            </table>
        </div>

    </div>
</div>
