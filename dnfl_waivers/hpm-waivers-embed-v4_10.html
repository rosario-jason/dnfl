<div class="dnfl-card" id="dnfl-waivers-container">
    <div class="dnfl-card-header">
        <h3 class="dnfl-card-title"><i class="fa-solid fa-users-viewfinder"></i> Waiver Targets & Player Matrix</h3>
        <div class="dnfl-card-subtitle">Market values, position floors, and upgrade targets</div>
    </div>
    <div class="dnfl-card-body">
        <!-- Floor Summary Panel -->
        <div class="dnfl-banner-panel">
            <div class="dnfl-banner-pills-wrapper" id="dnfl-waivers-pills-wrapper">
                <!-- Floor pills rendered dynamically -->
            </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="dnfl-toolbar">
            <div class="dnfl-toolbar-group">
                <label for="dnfl-waivers-view-filter" class="dnfl-toolbar-label">View:</label>
                <select id="dnfl-waivers-view-filter" class="dnfl-select">
                    <option value="waiverTargets" selected>Waiver Targets</option>
                    <option value="allPlayers">All Players</option>
                    <option value="freeAgents">Free Agents</option>
                    <option value="rostered">Rostered Players</option>
                </select>
            </div>
            <div class="dnfl-toolbar-group">
                <label for="dnfl-waivers-pos-filter" class="dnfl-toolbar-label">Position:</label>
                <select id="dnfl-waivers-pos-filter" class="dnfl-select">
                    <option value="ALL" selected>All Positions</option>
                    <option value="QB">QB</option>
                    <option value="RB">RB</option>
                    <option value="WR">WR</option>
                    <option value="TE">TE</option>
                    <option value="FLEX">FLEX (RB/WR/TE)</option>
                    <option value="PK">PK</option>
                    <option value="DEF">DEF</option>
                </select>
            </div>
            <div class="dnfl-toolbar-group dnfl-toolbar-search">
                <input type="text" id="dnfl-waivers-search-input" class="dnfl-input" placeholder="Search player, team..." />
            </div>
            <div id="dnfl-waivers-count-summary" class="dnfl-toolbar-summary">
                Loading player matrix...
            </div>
        </div>

        <!-- Table Container -->
        <div class="dnfl-table-responsive">
            <table class="dnfl-table dnfl-waivers-table">
                <thead id="dnfl-waivers-thead">
                    <!-- Table header rendered dynamically -->
                </thead>
                <tbody id="dnfl-waivers-tbody">
                    <!-- Table body rendered dynamically -->
                </tbody>
            </table>
        </div>
    </div>
</div>
