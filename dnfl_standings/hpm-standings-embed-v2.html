<!-- DNFL Standings -->

<div id="dnfl_standings" class="mobile-wrap">
    <table class="homepagemodule report" cellspacing="1" align="center">
        <caption><span>DNFL League Standings</span></caption>
    </table>
    <div class="toggle_tabs">
        <br>

        <!-- Controls Container -->
        <div class="dnfl-module-container">
            <div class="dnfl-toolbar" style="justify-content: space-between;">
                
                <!-- Left Side: Dropdown Filter -->
                <div class="dnfl-filter-group">
                    <label for="dnfl_standings_confFilter">Conference:</label>
                    <select id="dnfl_standings_confFilter" class="dnfl-select" onchange="DNFL.Standings.updateView()"></select>
                </div>

                <!-- Right Side: Dynamic Key & Disclaimer -->
                <div id="dnfl-standings-key">
                    <!-- Content injected dynamically by JS engine -->
                </div>

            </div>
        </div>

        <!-- Table Container -->
        <div class="dnfl-table-wrapper">
            <table class="dnfl-table dnfl-standings-table">
                <thead>
                    <tr>
                        <th style="width: 10%; text-align: left;">Seed</th>
                        <th style="width: 40%; text-align: left;">Franchise</th>
                        <th class="dnfl-hide-mobile" style="text-align: center;">PF</th>
                        <th class="dnfl-hide-mobile" style="text-align: center;">PA</th>
                        <th style="text-align: center;">Record</th>
                        <th class="dnfl-hide-mobile" style="text-align: center;">BBID $</th>
                    </tr>
                </thead>
                <tbody id="dnfl-standings-tbody">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 2.5rem; font-weight: 600; color: var(--dnfl-text-main);">
                            Loading DNFL League Standings...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
