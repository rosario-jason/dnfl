<!-- DNFL Standings v3.36 -->

<div id="dnfl_standings" class="mobile-wrap">
    <table class="homepagemodule report" cellspacing="1" align="center">
        <caption><span>DNFL League Standings</span></caption>
    </table>
    <div class="toggle_tabs">
        <br>

        <div class="dnfl-module-container">
            <!-- Controls Toolbar -->
            <div class="dnfl-toolbar">
                
                <!-- Left Side: Conference Filter Dropdown -->
                <div class="dnfl-filter-group">
                    <label for="dnfl_standings_confFilter">Conference:</label>
                    <select id="dnfl_standings_confFilter" class="dnfl-select" onchange="DNFL.Standings.updateView()"></select>
                </div>

                <!-- Right Side: Dynamic Legend Key & Disclaimer (Injected by JS Engine) -->
                <div id="dnfl-standings-key" class="dnfl-actions-right">
                    <!-- Content injected dynamically by DNFL.Standings.renderStandingsKey() -->
                </div>

            </div>
        </div>

        <!-- Standings Data Table Container -->
        <div class="dnfl-table-wrapper">
            <table class="dnfl-table dnfl-standings-table">
                <thead>
                    <tr>
                        <th>Seed</th>
                        <th>Franchise</th>
                        <th class="dnfl-hide-mobile">PF</th>
                        <th class="dnfl-hide-mobile">PA</th>
                        <th>Record</th>
                        <th class="dnfl-hide-mobile">BBID $</th>
                    </tr>
                </thead>
                <tbody id="dnfl-standings-tbody">
                    <tr>
                        <td colspan="6" class="dnfl-status-loading" style="text-align: center; padding: 2.5rem; font-weight: 600;">
                            Loading DNFL League Standings...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>



    </div>
</div>
