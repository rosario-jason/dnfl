<!-- DNFL LAST TEAM STANDING (LTS) MODULE EMBED v4.11 -->
<div class="dnfl-card" id="dnfl-lts-container">
    <!-- Level 1: Card Header -->
    <div class="dnfl-card-header">
        <h3 class="dnfl-card-title" id="dnfl-lts-card-title">
            <i class="fa-solid fa-medal dnfl-icon-amber"></i> Loading Last Team Standing...
        </h3>
    </div>

    <!-- Level 2: Card Body -->
    <div class="dnfl-card-body">
        <!-- Level 3: Controls Toolbar -->
        <div class="dnfl-toolbar" id="dnfl-lts-toolbar">
            <div class="dnfl-filter-group">
                <label for="dnfl-lts-conf-select">Conference Filter</label>
                <select id="dnfl-lts-conf-select" class="dnfl-select" onchange="DNFL.LTS.updateView()">
                    <option value="">Loading Conferences...</option>
                </select>
            </div>
            <div class="dnfl-buttons-right">
                <button type="button" id="dnfl-lts-toggle-scores-btn" class="dnfl-btn dnfl-btn-secondary" onclick="DNFL.LTS.toggleScores()" title="Toggle Weekly Scores Table">
                    <i class="fa-solid fa-table-cells"></i> Hide Scores
                </button>
            </div>
        </div>

        <!-- Level 3: Dynamic Legend Panel -->
        <div id="dnfl-lts-legend" class="dnfl-legend-panel"></div>

        <!-- Level 3: Table 1 Section Wrapper: Weekly Scores -->
        <div id="dnfl-lts-scores-section" class="dnfl-lts-section">
            <div id="dnfl-lts-scores-container" class="dnfl-lts-view-container"></div>
        </div>

        <!-- Level 3: Table 2 Section Wrapper: Weekly Summary -->
        <div id="dnfl-lts-summary-section" class="dnfl-lts-section">
            <div id="dnfl-lts-summary-container" class="dnfl-lts-view-container"></div>
        </div>
    </div>
</div>
