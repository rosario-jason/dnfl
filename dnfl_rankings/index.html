<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3 2026 DNFL Power Rankings</title>
    <!-- Load Chart.js v4 and PapaParse CDN libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.6.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 1.5rem;
            font-size: 1.063rem;
        }
        .chart-container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            gap: 1.25rem;
            background: #262626;
            padding: 0.938rem;
            border-radius: 8px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }
        .filter-group label {
            font-size: 0.875rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select {
            background: #121212;
            color: #ffffff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 1rem;
            min-width: 160px;
        }
        select:focus {
            outline: none;
            border-color: #36a2eb;
        }
        .chart-wrapper {
            position: relative;
            min-height: 500px;
            max-height: 1000px;
            height: 100vh; 
            width: 100%;
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
        }
        
    </style>
</head>
<body>

<div class="chart-container">
    <div class="controls">
        <div class="filter-group">
            <label for="weekSelector">Week:</label>
            <select id="weekSelector" onchange="loadWeeklyData()"></select>
        </div>
        <div class="filter-group">
            <label for="confFilter">Conference:</label>
            <select id="confFilter" onchange="applyConferenceFilter()">
                <option value="All">All Conferences</option>
                <option value="Cameron Crazies">Cameron Crazies</option>
                <option value="K-Ville">K-Ville</option>
                <option value="Blue Devils">Blue Devils</option>
            </select>
        </div>
    </div>

    <div class="chart-wrapper">
        <canvas id="powerRankingChart"></canvas>
    </div>
</div>

<script>
let masterData = [];
let chartInstance = null;

// 🟢 CHRONOLOGICAL LOG: Add new weeks to the BOTTOM of this list as the season moves on
const publishedWeeks = [
    { id: "00_pre-season", display: "Pre-Season" }
    // { id: "01", display: "Week 1" } <-- Add rows here each week!
];

const conferenceColors = {
    'Cameron Crazies': 'rgba(54, 162, 235, 0.85)',   
    'K-Ville': 'rgba(255, 99, 132, 0.85)',           
    'Blue Devils': 'rgba(75, 192, 192, 0.85)'        
};

const conferenceBorders = {
    'Cameron Crazies': 'rgb(54, 162, 235)',
    'K-Ville': 'rgb(255, 99, 132)',
    'Blue Devils': 'rgb(75, 192, 192)'
};

function initDashboard() {
    const selector = document.getElementById('weekSelector');
    selector.innerHTML = ''; 

    publishedWeeks.forEach(week => {
        const opt = document.createElement('option');
        opt.value = week.id;
        opt.textContent = week.display;
        selector.appendChild(opt);
    });

    // Auto-select the newest entry at the bottom of the list
    const mostRecentWeek = publishedWeeks[publishedWeeks.length - 1];
    selector.value = mostRecentWeek.id;

    loadWeeklyData();
}

function loadWeeklyData() {
    const selectedWeekFile = document.getElementById('weekSelector').value;
    const filePath = `data/data_${selectedWeekFile}.csv`;

    Papa.parse(filePath, {
        download: true,
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        complete: function(results) {
            masterData = results.data.map(row => ({
                franchise: row['Franchise'] || 'Unknown Team',
                conference: row['Conference'] || 'Other',
                division: row['Conference - Division'] || '',
                owner: row['Owner Name'] || row['Owner'] || 'N/A',
                coOwner: row['Co-Owner Name'] || row['Co-Owner'] || '',
                grade: parseFloat(row['Overall Grade'] || row['Grade'] || 0),
                projectedRecord: row['Projected W-L'] || 'N/A',
                rank: row['Rank'] || 'N/A'
            }));

            applyConferenceFilter();
        },
        error: function(err) {
            console.error("Data error: ", err);
            alert(`Error reading file. Ensure data_${selectedWeekFile}.csv is inside your data/ folder.`);
        }
    });
}

function renderChart(records) {
    // Sort highest to lowest grade for display logic
    const sorted = [...records].sort((a, b) => b.grade - a.grade);

    const labels = sorted.map(r => r.franchise);
    const dataValues = sorted.map(r => r.grade);
    const backgroundColors = sorted.map(r => conferenceColors[r.conference] || 'rgba(201, 203, 207, 0.85)');
    const borderColors = sorted.map(r => conferenceBorders[r.conference] || 'rgb(201, 203, 207)');

    const weekDropdown = document.getElementById('weekSelector');
    const displaySubtitle = weekDropdown.options[weekDropdown.selectedIndex].text + " Ranking";

    const ctx = document.getElementById('powerRankingChart').getContext('2d');

    if (chartInstance) { chartInstance.destroy(); }

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                data: dataValues,
                backgroundColor: backgroundColors,
                borderColor: borderColors,
                borderWidth: 1,
                borderRadius: 4,      
                borderSkipped: false
            }]
        },
        options: {
            indexAxis: 'y', // Explicitly horizontal
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {
                    display: true,
                    text: 'DNFL Power Ranking',
                    color: '#ffffff',
                    font: { size: 18, weight: 'bold' }
                },
                subtitle: {
                    display: true,
                    text: displaySubtitle, 
                    color: '#ffffff',
                    font: { size: 16, style: 'italic' },
                    padding: { bottom: 15 }
                },
                legend: { display: true, position: 'top', labels: { font: {size: 12 } } },
                tooltip: {
                    backgroundColor: 'rgba(20, 20, 20, 0.95)',
                    titleColor: '#ffffff',
                    bodyColor: '#dddddd',
                    titleFont: { size: 14 },
                    bodyFont: { size: 14 },
                    borderColor: '#444',
                    borderWidth: 1,
                    padding: 12,
                    enabled: true,
                    callbacks: {
                        title: function(context) { 
                            return context[0].label; 
                        },
                        label: function(context) {
                            const franchiseName = context.label;
                            // Find precise record from sorted source data
                            const item = sorted.find(r => r.franchise === franchiseName);
                            
                            if (!item) return 'No data found';

                            const owners = item.coOwner ? `${item.owner}, ${item.coOwner}` : item.owner;
                            return [
                                `${item.division}`,
                                `${owners}`,
                                `DNFL Rank: ${item.rank}`,
                                `Overall Grade: ${item.grade}`,
                                `Projected Record: ${item.projectedRecord}`
                            ];
                        }
                    }
                }
            },
            scales: {
                x: {
                    min: 50, max: 100,
                    grid: { color: 'rgba(255, 255, 255, 0.1)' },
                    ticks: { color: '#ffffff' },
                    title: { display: true, text: 'Power Rank Grade', color: 'ffffff', font: { size: 14, weight: 'bold'}, padding: 15 }
                },
                y: {
                    grid: { display: false },
                    ticks: { align: 'center', color: '#ffffff', font: { size: 14 } },
                    autoSkip: false
                }
            }
        }
    });
}

function applyConferenceFilter() {
    const selected = document.getElementById('confFilter').value;
    const wrapper = document.querySelector('.chart-wrapper');
    
    let filtered;
    if (selected === 'All') {
        filtered = masterData;
    } else {
        filtered = masterData.filter(d => d.conference.trim().toLowerCase() === selected.toLowerCase());
    }

    // 🧮 Dynamic Height Scaler: Multiplies matching row count by 32px 
    // Adds an extra 100px cushion to give room for the title, subtitle, and axis text layouts.
    const calculatedHeight = (filtered.length * 32) + 100;
    wrapper.style.height = calculatedHeight + 'px';

    // Pass the correctly sized data subset to your renderer pipeline
    renderChart(filtered);
}

window.onload = initDashboard;
</script>
</body>
</html>
