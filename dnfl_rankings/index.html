<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>v5.05 2026 DNFL Power Rankings</title>
    <!-- Load Chart.js v4 and PapaParse CDN libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.6.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: Roboto, sans-serif;
            background-color: #eeeeee;
            color: #121212;
            margin: 0;
            padding: 1.5rem;
            font-size: 1rem;
        }
        .chart-container {
            width: 95%;
            max-width: 1000px;
            margin: 0 auto 2rem auto;
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
                box-sizing: border-box;
        }

        .chart-container h1 {
            color: #121212;
            font-size: 1.2rem;
            text-align: center;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
            background: #ffffff;
            padding: 0.938rem;
            border-radius: 8px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
        }
        .filter-group label {
            font-size: 0.875rem;
            color: #121212;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select {
            background: #ffffff;
            color: #121212;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 1rem;
            min-width: 160px;
        }
        select:focus {
            outline: none;
            border-color: #36a2eb;
        }
        .chart-wrapper {
            position: relative;
            min-height: 500px;
            max-height: 1000px;
            height: 100vh; 
            width: 100%;
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
        }
        
        /* 📊 Data Table Grid Styling */
        .table-wrapper {
            width: 95%;
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            overflow-x: auto;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            box-sizing: border-box; 
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.8rem;
        }
        th {
            background-color: #ffffff;
            color: #121212;
            padding: 12px 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #444;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #333;
            color: #121212;
        }

        tr:nth-child(even) {
            background-color: #FAFAFA;
        }

         tr:hover {
            background-color: #FDE68A;
        }

        .rank-badge {
            font-weight: bold;
            color: #ffffff;
            padding: 3px 3px;
            border-radius: 4px;
            display: inline-block;
            text-align: center;
            min-width: 1.1rem; /* Keeps rank badges uniform uniform if ranks hit double digits */
        }

        /* 🕹️ Visibility Toggle Button Layout Rules */
        .section-header-row {
            display: flex;
            width: 100%;
            margin-bottom: 0.75rem;
        }
        .section-title-text {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0;
        }
        .visibility-toggle-btn {
            font-size: 0.7rem;
            font-weight: bold;
            color: #00539B;
            text-transform: uppercase;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            user-select: none;
        }
        .visibility-toggle-btn:hover {
            color: #eeeeee;
        }
    </style>
</head>
<body>

<div class="chart-container">
    <h1>DNFL Power Rankings</h1>
    <div class="controls">
        <div class="filter-group">
            <label for="weekSelector">Ranking Week:</label>
            <select id="weekSelector" onchange="loadWeeklyData()"></select>
        </div>
        <div class="filter-group">
            <label for="confFilter">Conference:</label>
            <select id="confFilter" onchange="applyConferenceFilter()">
                <option value="All">All Conferences</option>
                <option value="Cameron Crazies">Cameron Crazies</option>
                <option value="K-Ville">K-Ville</option>
                <option value="Blue Devils">Blue Devils</option>
            </select>
        </div>
    </div>

    <!-- 📊 Responsive HTML Legend Module for Conference Color Mapping -->
    <div style="display: flex; gap: 20px; justify-content: flex-start; margin: 15px 0; background: #eeeeee; padding: 12px 15px; border-radius: 8px; border: 1px solid #333; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
            <span style="display: inline-block; width: 18px; height: 18px; background: rgba(54, 162, 235, 0.85); border: 1px solid rgb(54, 162, 235); border-radius: 4px;"></span>
            <span>Cameron Crazies</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
            <span style="display: inline-block; width: 18px; height: 18px; background: rgba(255, 99, 132, 0.85); border: 1px solid rgb(255, 99, 132); border-radius: 4px;"></span>
            <span>K-Ville</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
            <span style="display: inline-block; width: 18px; height: 18px; background: rgba(75, 192, 192, 0.85); border: 1px solid rgb(75, 192, 192); border-radius: 4px;"></span>
            <span>Blue Devils</span>
        </div>
    </div>
    
    <!-- 🕹️ Chart Header + Toggle Control -->
    <div class="section-header-row">
        <button id="chartToggleBtn" class="visibility-toggle-btn" onclick="toggleElementVisibility('chart')">Hide Chart</button>
    </div>

    <div id="chartWrapperContainer" class="chart-wrapper">
        <canvas id="powerRankingChart"></canvas>
    </div>

</div>

<!-- 📋 Dynamic Synchronized Data Table Wrapper -->
<!-- 🕹️ Table Header + Toggle Control (Matches width card baseline) -->

<!-- Ensure your table wrapper container has this exact ID -->
<div id="tableWrapperContainer" class="table-wrapper">
    <div class="section-header-row">
        <button id="tableToggleBtn" class="visibility-toggle-btn" onclick="toggleElementVisibility('table')">Hide Table</button>
    </div>
    <table id="dnflDataTable">
        <thead>
            <tr>
                <th style="width: 7%;">Rank</th>
                <th style="width: 18%;">Franchise</th>
                <th style="width: 18%;">Owners</th>
                <th style="text-align: center; width: 7%;">Grade</th>
                <th style="text-align: center; width: 10%;">Proj W-L</th>
                <th style="width: 40%;">Rank Comments</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- JavaScript handles programmatic row injection here -->
        </tbody>
    </table>
</div>

<script>
let masterData = [];
let chartInstance = null;

// 🟢 CHRONOLOGICAL LOG: Add new weeks to the BOTTOM of this list as the season moves on
const publishedWeeks = [
    { id: "00_pre-season", display: "Pre-Season" }
    // { id: "01", display: "Week 1" } <-- Add rows here each week!
];

const conferenceColors = {
    'Cameron Crazies': 'rgba(54, 162, 235, 0.85)',   
    'K-Ville': 'rgba(255, 99, 132, 0.85)',           
    'Blue Devils': 'rgba(75, 192, 192, 0.85)'        
};

const conferenceBorders = {
    'Cameron Crazies': 'rgb(54, 162, 235)',
    'K-Ville': 'rgb(255, 99, 132)',
    'Blue Devils': 'rgb(75, 192, 192)'
};

function initDashboard() {
    const selector = document.getElementById('weekSelector');
    selector.innerHTML = ''; 

    publishedWeeks.forEach(week => {
        const opt = document.createElement('option');
        opt.value = week.id;
        opt.textContent = week.display;
        selector.appendChild(opt);
    });

    // Auto-select the newest entry at the bottom of the list
    const mostRecentWeek = publishedWeeks[publishedWeeks.length - 1];
    selector.value = mostRecentWeek.id;

    loadWeeklyData();
}

function loadWeeklyData() {
    const selectedWeekFile = document.getElementById('weekSelector').value;
    const filePath = 'data/data_' + selectedWeekFile + '.csv';

    Papa.parse(filePath, {
        download: true,
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        complete: function(results) {
            masterData = results.data.map(row => {
                const rawConference = row['Conference'] ? String(row['Conference']).trim() : 'Other';
                const divisionName = row['Conference - Division'] ? String(row['Conference - Division']).trim() : 'N/A';

                return {
                    rank: parseInt(row['Rank'] || 0),
                    franchise: row['Franchise'] ? String(row['Franchise']).trim() : 'Unknown Team',
                    conference: row['Conference'] || 'Other',
                    division: row['Conference - Division'] || '',
                    owner: row['Owner Name'] || 'N/A',
                    coOwner: row['Co-Owner Name'] || '',
                    grade: parseFloat(row['Overall Grade'] || 0),
                    projectedRecord: row['Projected W-L'] || 'N/A',
                    comments: row['Rank Comments'] || 'No comment provided.' // Ingests your new column target
                };
            });

            applyConferenceFilter();
        },
        error: function(err) {
            console.error("Data fetch error: ", err);
        }
    });
}

function renderChartAndTable(records) {
    // 1. Sort records by Rank chronologically (ascending order: 1 to 36)
    const sortedData = [...records].sort((a, b) => a.rank - b.rank);

    // 2. BUILD THE GRID DATA TABLE INTERACTIVE ROWS
    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = ''; // Wipe past filter items completely

    sortedData.forEach(item => {
        const row = document.createElement('tr');
        const completeOwners = item.coOwner ? `${item.owner}, ${item.coOwner}` : item.owner;

        // 🟢 Dynamic Color Lookup: Grab color from dictionary using the trimmed conference name
        const confKey = String(item.conference).trim();
        const badgeColor = conferenceColors[confKey] || '#333333'; // Defaults to dark gray if unmatched
        const borderStyle = conferenceBorders[confKey] || '#444444';

        row.innerHTML = `
            <td>
                <!-- Inline style dynamically injects the conference color -->
                <span class="rank-badge" style="background-color: ${badgeColor}; border: 1px solid ${borderStyle}; ">
                    ${item.rank}
                </span>
            </td>
            <td style="font-weight: 600; ">${item.franchise}</td>
            <td>${completeOwners}</td>
            <td style="text-align: center; font-weight: 600; ">${item.grade.toFixed(1)}</td>
            <td style="text-align: center;">${item.projectedRecord}</td>
            <td>${item.comments}</td>
        `;
        tableBody.appendChild(row);
    });

    // 3. BUILD THE VISUAL BAR CHART TIMELINE
    const chartSorted = [...records].sort((a, b) => b.grade - a.grade);

    const labels = chartSorted.map(r => r.franchise);
    const dataValues = chartSorted.map(r => r.grade);
    const backgroundColors = chartSorted.map(r => conferenceColors[r.conference] || 'rgba(201, 203, 207, 0.85)');
    const borderColors = chartSorted.map(r => conferenceBorders[r.conference] || 'rgb(201, 203, 207)');

    const weekDropdown = document.getElementById('weekSelector');
    const displaySubtitle = weekDropdown.options[weekDropdown.selectedIndex] ? 
                            weekDropdown.options[weekDropdown.selectedIndex].text + " Ranking" : "Ranking";

    const rootFontSize = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    const ctx = document.getElementById('powerRankingChart').getContext('2d');

    if (chartInstance) { chartInstance.destroy(); }

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                data: dataValues,
                backgroundColor: backgroundColors,
                borderColor: borderColors,
                borderWidth: 1,
                borderRadius: 4,      
                borderSkipped: false
            }]
        },
        options: {
            indexAxis: 'y', 
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: { display: false },
                subtitle: {
                    display: true,
                    text: displaySubtitle, 
                    color: '#121212',
                    font: { size: 1.0 * rootFontSize, weight: 'bold' },
                    padding: { bottom: 15 }
                },
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#eeeeee',
                    titleColor: '#121212',
                    bodyColor: '#121212',
                    titleFont: { size: 14 },
                    bodyFont: { size: 14 },
                    borderColor: '#444',
                    borderWidth: 1,
                    padding: 12,
                    enabled: true,
                    titleFont: { size: 1.0 * rootFontSize, weight: 'bold' },
                    bodyFont: { size: 0.875 * rootFontSize },
                    callbacks: {
                        title: function(context) { return context.label; },
                        label: function(context) {
                            const franchiseName = context.label;
                            const item = chartSorted.find(r => r.franchise === franchiseName);
                            if (!item) return 'No data found';
                            const owners = item.coOwner ? `${item.owner}, ${item.coOwner}` : item.owner;
                            return [
                                `${item.division}`,
                                `${owners}`,
                                `DNFL Rank: ${item.rank}`,
                                `Overall Grade: ${item.grade}`,
                                `Projected Record: ${item.projectedRecord}`
                            ];
                        }
                    }
                }
            },
            scales: {
                x: {
                    min: 50, max: 100,
                    grid: { color: 'rgba(255, 255, 255, 0.1)' },
                    ticks: { color: '#121212', font: { size: Math.round(0.813 * rootFontSize) } },
                    title: { display: true, text: 'Power Rank Grade', color: '#121212', font: { size: 14 }, padding: 15 }
                },
                y: {
                    grid: { display: false },
                    ticks: { align: 'center', color: '#121212', font: { size: Math.round(0.813 * rootFontSize) } }
                }
            }
        }
    });
}

function applyConferenceFilter() {
    const selected = document.getElementById('confFilter').value;
    const wrapper = document.getElementById('chartWrapperContainer');
    
    let filtered;
    if (selected === 'All') {
        filtered = masterData;
    } else {
        filtered = masterData.filter(d => d.conference.trim().toLowerCase() === selected.toLowerCase());
    }

    // 🧮 Dynamic 32px Height Allocation Formula per visible row 
    // Only apply if the chart container is currently expanded/visible
    if (wrapper.style.display !== 'none') {
        const calculatedHeight = (filtered.length * 32) + 100;
        wrapper.style.height = calculatedHeight + 'px';
    }

    // Dispatches synchronized update to both the grid list and graphic canvas
    renderChartAndTable(filtered);
}

// 🟢 Visibility Toggle Control Engine
function toggleElementVisibility(sectionType) {
    if (sectionType === 'chart') {
        const wrapper = document.getElementById('chartWrapperContainer');
        const button = document.getElementById('chartToggleBtn');
        
        if (wrapper.style.display === 'none') {
            wrapper.style.display = 'block';
            button.textContent = 'Hide Chart';
            applyConferenceFilter(); // Recomputes height canvas mapping calculations
        } else {
            wrapper.style.display = 'none';
            button.textContent = 'Show Chart';
        }
    } else if (sectionType === 'table') {
        const wrapper = document.getElementById('dnflDataTable');
        const button = document.getElementById('tableToggleBtn');
        
        if (wrapper.style.display === 'none') {
            wrapper.style.display = 'block';
            button.textContent = 'Hide Table';
        } else {
            wrapper.style.display = 'none';
            button.textContent = 'Show Table';
        }
    }
}

window.onload = initDashboard;
</script>
</body>
</html>
