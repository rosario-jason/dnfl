<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TEST2 2026 DNFL Power Rankings</title>
    <!-- Load Chart.js v4 and PapaParse CDN libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.6.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 1.5rem; /* Responsive canvas margins */
            font-size: 1.063rem; /* Approx 17px base layout typography */
        }
        .chart-container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 1.5rem; 
            border-radius: 12px; /* Rigid px structures keep border edges crisp */
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 1.25rem; 
            flex-wrap: wrap;
            gap: 1.25rem; 
            background: #262626;
            padding: 0.938rem; 
            border-radius: 8px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.375rem; /* Gap scales proportionally if user zooms browser */
        }
        .filter-group label {
            font-size: 0.875rem; /* Approx 14px easily scannable headers */
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        select {
            background: #121212;
            color: #ffffff;
            border: 1px solid #444; /* Clean 1px framework lines */
            padding: 8px 12px; 
            border-radius: 6px;
            font-size: 1rem; /* Standard input text readability */
            min-width: 160px;
        }
        select:focus {
            outline: none;
            border-color: #36a2eb;
        }
        .chart-wrapper {
            position: relative;
            height: 850px; 
            width: 100%;
        }
    </style>
</head>
<body>

<div class="chart-container">
    <h2>2026 DNFL Power Rankings</h2>

    <div class="controls">
        <div class="filter-group">
            <label for="weekSelector">Week:</label>
            <select id="weekSelector" onchange="loadWeeklyData()"></select>
        </div>
        <div class="filter-group">
            <label for="confFilter">Conference:</label>
            <select id="confFilter" onchange="applyConferenceFilter()">
                <option value="All">All Conferences</option>
                <option value="Cameron Crazies">Cameron Crazies</option>
                <option value="K-Ville">K-Ville</option>
                <option value="Blue Devils">Blue Devils</option>
            </select>
        </div>
    </div>

    <div class="chart-wrapper">
        <canvas id="powerRankingChart"></canvas>
    </div>
</div>

<script>
let masterData = [];
let chartInstance = null;

// 🟢 CHRONOLOGICAL LOG: Add new weeks to the BOTTOM of this list as the season moves on
const publishedWeeks = [
    { id: "00_pre-season", display: "Pre-Season" }
];

const conferenceColors = {
    'Cameron Crazies': 'rgba(54, 162, 235, 0.85)',   
    'K-Ville': 'rgba(255, 99, 132, 0.85)',           
    'Blue Devils': 'rgba(75, 192, 192, 0.85)'        
};

const conferenceBorders = {
    'Cameron Crazies': 'rgb(54, 162, 235)',
    'K-Ville': 'rgb(255, 99, 132)',
    'Blue Devils': 'rgb(75, 192, 192)'
};

function initDashboard() {
    const selector = document.getElementById('weekSelector');
    selector.innerHTML = ''; 

    publishedWeeks.forEach(week => {
        const opt = document.createElement('option');
        opt.value = week.id;
        opt.textContent = week.display;
        selector.appendChild(opt);
    });

    const mostRecentWeek = publishedWeeks[publishedWeeks.length - 1];
    selector.value = mostRecentWeek.id;

    loadWeeklyData();
}

function loadWeeklyData() {
    const selectedWeekFile = document.getElementById('weekSelector').value;
    const filePath = `data/data_${selectedWeekFile}.csv`;

    Papa.parse(filePath, {
        download: true,
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        complete: function(results) {
            masterData = results.data.map(row => {
                const rawConference = row['Conference'] ? String(row['Conference']).trim() : 'Other';
                const divisionName = row['Conference - Division'] ? String(row['Conference - Division']).trim() : 'N/A';

                return {
                    franchise: row['Franchise'] ? String(row['Franchise']).trim() : 'Unknown Team',
                    conference: rawConference,
                    division: divisionName,
                    owner: row['Owner Name'] || 'N/A',
                    coOwner: row['Co-Owner Name'] || '',
                    grade: parseFloat(row['Overall Grade'] || 0),
                    projectedRecord: row['Projected W-L'] || 'N/A'
                };
            });

            applyConferenceFilter();
        },
        error: function(err) {
            console.error("Data fetch error: ", err);
        }
    });
}

function renderChart(records) {
    const sorted = [...records].sort((a, b) => b.grade - a.grade);

    const labels = sorted.map(r => r.franchise);
    const dataValues = sorted.map(r => r.grade);
    const backgroundColors = sorted.map(r => conferenceColors[r.conference] || 'rgba(201, 203, 207, 0.85)');
    const borderColors = sorted.map(r => conferenceBorders[r.conference] || 'rgb(201, 203, 207)');

    const weekDropdown = document.getElementById('weekSelector');
    const displaySubtitle = weekDropdown.options[weekDropdown.selectedIndex] ? 
                            weekDropdown.options[weekDropdown.selectedIndex].text + " Ranking" : "Ranking";

    // 🖥️ Programmatic Rem-to-Px Conversion Engine:
    // Captures user baseline and safely scales canvas text parameters
    const rootFontSize = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;

    const ctx = document.getElementById('powerRankingChart').getContext('2d');

    if (chartInstance) { chartInstance.destroy(); }

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                data: dataValues,
                backgroundColor: backgroundColors,
                borderColor: borderColors,
                borderWidth: 1,
                borderRadius: 4,      
                borderSkipped: false
            }]
        },
        options: {
            indexAxis: 'y', 
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: {
                    display: true,
                    text: 'DNFL Power Ranking',
                    color: '#ffffff',
                    font: { 
                        size: 1.5 * rootFontSize, /* Responsive 1.5rem equivalent (24px) */
                        weight: 'bold' 
                    },
                    padding: { top: 5, bottom: 2 }
                },
                subtitle: {
                    display: true,
                    text: displaySubtitle, 
                    color: '#aaaaaa',
                    font: { 
                        size: 1.0 * rootFontSize, /* Responsive 1.0rem equivalent (16px) */
                        style: 'italic' 
                    },
                    padding: { bottom: 15 }
                },
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(20, 20, 20, 0.95)',
                    titleColor: '#ffffff',
                    bodyColor: '#dddddd',
                    borderColor: '#444',
                    borderWidth: 1,
                    padding: 12,
                    enabled: true,
                    titleFont: { 
                        size: 1.0 * rootFontSize, /* Responsive 16px hover title text */
                        weight: 'bold' 
                    },
                    bodyFont: { 
                        size: 0.875 * rootFontSize /* Responsive 14px description text */
                    },
                    callbacks: {
                        title: function(context) { 
                            return context.label; 
                        },
                        label: function(context) {
                            const franchiseName = context.label;
                            const item = sorted.find(r => r.franchise === franchiseName);
                            
                            if (!item) return 'No data found';

                            const owners = item.coOwner ? `${item.owner}, ${item.coOwner}` : item.owner;
                            return [
                                `Division Group: ${item.division}`,
                                `Owners: ${owners}`,
                                `Overall Grade: ${item.grade}`,
                                `Projected Record: ${item.projectedRecord}`
                            ];
                        }
                    }
                }
            },
            scales: {
                x: {
                    min: 50, max: 100,
                    grid: { color: 'rgba(255, 255, 255, 0.1)' },
                    ticks: { 
                        color: '#ffffff',
                        font: { size: 0.813 * rootFontSize } /* Responsive 13px scale text */
                    }
                },
                y: {
                    grid: { display: false },
                    ticks: { 
                        color: '#ffffff',
