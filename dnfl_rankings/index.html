<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2026 DNFL Power Rankings</title>
    <!-- Optimized Stable CDN scripts -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 24px;
        }
        .chart-container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
            background: #262626;
            padding: 15px;
            border-radius: 8px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .filter-group label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select {
            background: #121212;
            color: #ffffff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            min-width: 160px;
        }
        select:focus {
            outline: none;
            border-color: #36a2eb;
        }
        .chart-wrapper {
            position: relative;
            height: 800px; 
            width: 100%;
        }
        .local-warning {
            background: #ff5252;
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="chart-container">
    <h2>2026 DNFL Power Rankings</h2>
    
    <!-- CORS Error Helper Banner -->
    <div id="localWarning" class="local-warning">
        <strong>⚠️ Local Browser Security Active:</strong> You are viewing this file directly from your computer computer (file:/// URL). Your browser is blocking the CSV data stream. Push these files to your GitHub repository to see the chart live!
    </div>

    <div class="controls">
        <div class="filter-group">
            <label for="weekSelector">Week:</label>
            <select id="weekSelector" onchange="loadWeeklyData()"></select>
        </div>
        <div class="filter-group">
            <label for="confFilter">Conference:</label>
            <select id="confFilter" onchange="applyConferenceFilter()">
                <option value="All">All Conferences</option>
                <option value="Cameron Crazies">Cameron Crazies</option>
                <option value="K-Ville">K-Ville</option>
                <option value="Blue Devils">Blue Devils</option>
            </select>
        </div>
    </div>

    <div class="chart-wrapper">
        <canvas id="powerRankingChart"></canvas>
    </div>
</div>

<script>
let masterData = [];
let chartInstance = null;

// Log your files here. Ensure names are exact matches to your filenames
const publishedWeeks = [
    { id: "00_pre-season", display: "Pre-Season" }
];

const conferenceColors = {
    'Cameron Crazies': 'rgba(54, 162, 235, 0.85)',   
    'K-Ville': 'rgba(255, 99, 132, 0.85)',           
    'Blue Devils': 'rgba(75, 192, 192, 0.85)'        
};

const conferenceBorders = {
    'Cameron Crazies': 'rgb(54, 162, 235)',
    'K-Ville': 'rgb(255, 99, 132)',
    'Blue Devils': 'rgb(75, 192, 192)'
};

function initDashboard() {
    // Show warning banner if running locally on computer hard drive
    if (window.location.protocol === 'file:') {
        document.getElementById('localWarning').style.display = 'block';
    }

    const selector = document.getElementById('weekSelector');
    selector.innerHTML = ''; 

    publishedWeeks.forEach(week => {
        const opt = document.createElement('option');
        opt.value = week.id;
        opt.textContent = week.display;
        selector.appendChild(opt);
    });

    const mostRecentWeek = publishedWeeks[publishedWeeks.length - 1];
    selector.value = mostRecentWeek.id;

    loadWeeklyData();
}

function loadWeeklyData() {
    const selectedWeekFile = document.getElementById('weekSelector').value;
    
    // Explicitly safe relative path calculation targeting your subfolder structure
    const filePath = `data/data_${selectedWeekFile}.csv`;

    Papa.parse(filePath, {
        download: true,
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        complete: function(results) {
            masterData = results.data.map(row => {
                const rawConference = row['Conference'] ? String(row['Conference']).trim() : 'Other';
                const divisionName = row['Conference - Division'] ? String(row['Conference - Division']).trim() : 'N/A';

                return {
                    franchise: row['Franchise'] || 'Unknown Team',
                    conference: rawConference,
                    division: divisionName,
                    owner: row['Owner Name'] || 'N/A',
                    coOwner: row['Co-Owner Name'] || '',
                    grade: parseFloat(row['Overall Grade'] || 0),
                    projectedRecord: row['Projected W-L'] || 'N/A'
                };
            });

            applyConferenceFilter();
        },
        error: function(err) {
            console.error("Data fetch error: ", err);
            // If running on local computer, fail gracefully instead of locking up
            if (window.location.protocol === 'file:') {
                console.log("CORS block prevented local file reading. This is normal on desktop files.");
            }
        }
    });
}

function renderChart(records) {
    const sorted = [...records].sort((a, b) => b.grade - a.grade);

    const labels = sorted.map(r => r.franchise);
    const dataValues = sorted.map(r => r.grade);
    const backgroundColors = sorted.map(r => conferenceColors[r.conference] || 'rgba(201, 203, 207, 0.85)');
    const borderColors = sorted.map(r => conferenceBorders[r.conference] || 'rgb(201, 203, 207)');

    const weekDropdown = document.getElementById('weekSelector');
    const displaySubtitle = weekDropdown.options[weekDropdown.selectedIndex] ? 
                            weekDropdown.options[weekDropdown.selectedIndex].text + " Ranking" : "Ranking";

    const ctx = document.getElementById('powerRankingChart').getContext('2d');

    if (chartInstance) { chartInstance.destroy(); }

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                data: dataValues,
                backgroundColor: backgroundColors,
                borderColor: borderColors,
                borderWidth: 1,
                borderRadius: 4,      
                borderSkipped: false
            }]
        },
        options: {
            indexAxis: 'y', 
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(20, 20, 20, 0.95)',
                    titleColor: '#ffffff',
                    bodyColor: '#dddddd',
                    borderColor: '#444',
                    borderWidth: 1,
                    padding: 12,
                    enabled: true,
                    callbacks: {
                        title: function(context) { 
                            return context[0].label; 
                        },
                        label: function(context) {
                            const franchiseName = context.label;
                            const item = sorted.find(r => r.franchise === franchiseName);
                            
                            if (!item) return 'No data found';

                            const owners = item.coOwner ? `${item.owner}, ${item.coOwner}` : item.owner;
                            return [
                                `Division Group: ${item.division}`,
                                `Owners: ${owners}`,
                                `Overall Grade: ${item.grade}`,
                                `Projected Record: ${item.projectedRecord}`
                            ];
                        }
                    }
                }
            },
            scales: {
                x: {
                    min: 50, max: 100,
                    grid: { color: 'rgba(255, 255, 255, 0.1)' },
                    ticks: { color: '#ffffff' }
                },
                y: {
                    grid: { display: false },
                    ticks: { color: '#ffffff', font: { size: 11 } }
                }
            }
        }
    });
}

function applyConferenceFilter() {
    const selected = document.getElementById('confFilter').value;
    if (selected === 'All') {
        renderChart(masterData);
    } else {
        const filtered = masterData.filter(d => d.conference.trim().toLowerCase() === selected.toLowerCase());
        renderChart(filtered);
    }
}

window.onload = initDashboard;
</script>
</body>
</html>
