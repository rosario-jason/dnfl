<!-- DNFL LAST TEAM STANDING (LTS) MODULE EMBED SHELL (v6) -->
<div class="dnfl-card" id="dnfl-lts-container">
    <div class="dnfl-card-header">
        <h3 id="dnfl-lts-title" class="dnfl-card-title">
            <i class="fa-solid fa-medal dnfl-icon-amber"></i> Last Team Standing
        </h3>
    </div>
    <div class="dnfl-card-body">
        <!-- Level 3: Controls Toolbar -->
        <div class="dnfl-toolbar">
            <div class="dnfl-filter-group">
                <label for="dnfl-lts-conference-select">Conference Filter</label>
                <select id="dnfl-lts-conference-select" class="dnfl-select" onchange="DNFL.LTS.updateView()"></select>
            </div>
            <div class="dnfl-buttons-right">
                <button id="dnfl-btn-lts-grid" class="dnfl-btn dnfl-btn-secondary" onclick="DNFL.LTS.toggleGrid()" title="Toggle Grid Matrix">
                    <i class="fa-solid fa-table-cells"></i> Hide Grid
                </button>
                <button id="dnfl-btn-lts-summary" class="dnfl-btn dnfl-btn-secondary" onclick="DNFL.LTS.toggleSummary()" title="Toggle Summary Table">
                    <i class="fa-solid fa-list-check"></i> Hide Summary
                </button>
            </div>
        </div>

        <!-- Dynamic Legend Panel (Uses Global _containers.scss) -->
        <div id="dnfl-lts-legend" class="dnfl-legend-panel"></div>

        <!-- Level 3: Content Containers -->
        <div id="dnfl-lts-content">
            <!-- Section 1: Cross-Grid Matrix -->
            <div id="dnfl-lts-grid-section" class="dnfl-lts-section">
                <div id="dnfl-lts-grid-container" class="dnfl-lts-view"></div>
            </div>

            <!-- Section 2: Weekly Survival Summary -->
            <div id="dnfl-lts-summary-section" class="dnfl-lts-section">
                <div id="dnfl-lts-summary-container" class="dnfl-lts-view"></div>
            </div>
        </div>
    </div>
</div>
